name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Set version
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          $hash = $env:SHA.Substring(0, 7)
          Set-Content -Path version.py -Value "__version__ = `"$env:TAG ($hash)`""

      - name: Build
        run: pyinstaller nowplay.spec --clean --noconfirm

      - name: Zip
        run: Compress-Archive -Path dist\NowPlaying\* -DestinationPath NowPlaying.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: NowPlaying.zip
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
